[workspace]
members = [".", "xtask"]
exclude = ["tests/verify"]
resolver = "3"

[package]
name = "reinstall-rs"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[features]
default = []
tui = ["dep:ratatui", "dep:crossterm"]

[dependencies]
ratatui = { version = "0.29", default-features = false, features = ["crossterm"], optional = true }
crossterm = { version = "0.28", default-features = false, features = ["events", "bracketed-paste"], optional = true }

[dev-dependencies]
libc = "0.2"

[lib]
path = "src/lib.rs"

[[bin]]
name = "reinstall"
path = "src/bin/reinstall.rs"

[[bin]]
name = "reinstall-worker"
path = "src/bin/reinstall-worker.rs"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
strip = true
