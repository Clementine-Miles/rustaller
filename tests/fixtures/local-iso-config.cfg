### BEGIN reinstall.sh ###
set timeout_style=menu
set timeout=5
# grubenv helper fixture
menuentry "reinstall (iso)" --unrestricted {
    insmod lvm
    insmod mdraid1x
    insmod all_video
    insmod loopback
    set btrfs_relative_path=n
    search --no-floppy --fs-uuid --set=iso_device '1111-2222'
    set iso_path='/images/live.iso'
    set img_dev='/dev/disk/by-uuid/1111-2222'
    set img_loop='/images/live.iso'
    export iso_path img_dev img_loop
    loopback loop ($iso_device)$iso_path
    set root=(loop)
    configfile (loop)/boot/grub/loopback.cfg
}
### END reinstall.sh ###
