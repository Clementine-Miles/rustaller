[package]
name = "rustaller-boot-uefi"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[[bin]]
name = "rustaller-boot-uefi"
path = "src/main.rs"
test = false
bench = false

[target.'cfg(target_os = "uefi")'.dependencies]
rustaller-boot-core = { path = "../core" }
uefi = { version = "0.41.0", features = ["alloc", "global_allocator", "panic_handler"] }
uefi-raw = "0.17.0"
