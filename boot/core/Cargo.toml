[package]
name = "rustaller-boot-core"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[features]
edit = ["dep:toml_edit"]

[dependencies]
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
toml = { version = "1.2", default-features = false, features = ["parse", "serde"] }
toml_edit = { version = "0.25", optional = true }
